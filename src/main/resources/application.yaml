spring:
  application:
    name: authservice

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

authservice:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 900000  # 15 minutes
    refresh-token-expiration-ms: 604800000  # 7 days
    
  cookie:
    refresh-token:
      path: /
      http-only: true
      secure: false
      same-site: LAX